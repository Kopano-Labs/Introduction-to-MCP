# Optional: fail PRs that touch swarm logs or doctrine without passing JSONL gates.
# Adjust branch filters to match how you merge swarm work (e.g. add codex/*).

name: Swarm proof gate

on:
  pull_request:
    branches: [master, main]
    paths: &swarm_paths
      - "docs/swarm-ops/**"
      - "scripts/kc_log_append.py"
      - "scripts/kc_guard.py"
      - "scripts/kc_production_verify_run.py"
      - "scripts/kc_verified_production.py"
      - "scripts/kc_apprenticeship_realism_report.py"
      - "scripts/kc_main_brain_roadmap.py"
      - "scripts/kc_swarm_agents_bootstrap.py"
      - "scripts/kc_cassy_activate.py"
      - "docs/swarm-ops/agents/**"
      - "docs/swarm-ops/MAIN_BRAIN_ROADMAP.json"
      - "docs/swarm-ops/SERVITUDE_TRIAD.md"
      - "kopano-core/kopano/swarm_agents_api.py"
      - "kopano-core/kopano/kc_swarm_console_api.py"
      - "kopano-core/studio/src/pages/ConsolePage.tsx"
      - "scripts/git_sync_monitor.py"
      - "scripts/swarm_remote_proof_urls.ps1"
      - "scripts/swarm_remote_proof_urls.sh"
      - "kopano-core/kopano/api.py"
      - "kopano-core/studio/src/apiBase.ts"
      - "kopano-core/studio/.env.example"
      - "tests/test_kc_log_append.py"
      - "tests/test_kc_guard.py"
      - "tests/test_agent_build_poc_validate.py"
      - "scripts/kc_agent_build_poc_validate.py"
      - "scripts/kc_bracket_lint.py"
      - "scripts/kc_ai_flow_operate.py"
      - "scripts/kc_phu_boot_v1.py"
      - "kopano-core/kopano/agent_build_poc_validate.py"
      - "kopano-core/kopano/lpm_lph_engine.py"
      - "kopano-core/kopano/kpefs_router.py"
      - "kopano-core/kopano/operating_mesh.py"
      - "kopano-core/kopano/graduation_bar.py"
      - "scripts/kc_phu_operating_mesh.py"
      - "scripts/kc_phu_graduation_bar.py"
      - "scripts/kc_kpefs_full_gate.py"
      - "kopano-core/kopano/external_swarm_lane.py"
      - "scripts/kc_external_swarm_lane.py"
      - "tests/test_external_swarm_lane.py"
      - "kopano-core/studio/src/operator/KpefsConsolePanel.tsx"
      - "tests/test_operating_mesh.py"
      - "tests/test_graduation_bar.py"
      - "docs/swarm-ops/AGENT_BUILD_POC_VALIDATION.json"
      - "docs/swarm-ops/LPM_LPH_GOD_COMPLEX_DOCTRINE.json"
      - "docs/swarm-ops/AI_FLOW_PROTOCOL.md"
      - "Structure/07-Agents/AI_FLOW_BINDINGS.json"
      - ".github/workflows/swarm-proof.yml"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - codex/kc-sovereign-gui-full-dev
    paths: *swarm_paths

jobs:
  swarm-jsonl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate KC JSONL + proof-check
        run: |
          python scripts/kc_log_append.py validate
          python scripts/kc_log_append.py proof-check

      - name: KC guard (sync + validate + proof + doc hosts + verified production)
        run: python scripts/kc_guard.py all --require-verified-production 10 --require-roadmap-gate

      - name: Install Kopano-Phu validator deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./kopano-core
          pip install -e ./CLI
          pip install pytest

      - name: Build ephemeral operating-mesh proof state
        run: python scripts/kc_ci_bootstrap_operating_mesh.py

      - name: Agent build PoC validate
        run: python scripts/kc_agent_build_poc_validate.py

      - name: KPEFS full gate
        run: python scripts/kc_kpefs_full_gate.py

      - name: Pytest swarm tools
        run: python -m pytest tests/test_kc_log_append.py tests/test_kc_guard.py tests/test_kc_apprenticeship.py tests/test_kc_training_api.py tests/test_kc_verified_production.py tests/test_kc_main_brain_roadmap.py tests/test_swarm_agents_api.py tests/test_swarm_console_api.py tests/test_agent_build_poc_validate.py tests/test_operating_mesh.py tests/test_graduation_bar.py tests/test_external_swarm_lane.py -q
