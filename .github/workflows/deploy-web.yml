name: "KPGS Web Deploy — All Domains"

# ──────────────────────────────────────────────────────────────────────
# KPGS Governance: Schematics MAIN BRAIN · ALP #168 · ce3519483f5eff54
# Deploys:
#   kopanolabs.com       → public/
#   careers.kopanolabs.com → public/careers/  (IONOS subdir or subdomain)
#   kasilink.com         → KasiLink/
# CrisisConnect deploys via its own repo to Vercel (separate pipeline).
# I_AM_STATELESS_RENTER_NOT_LANDLORD
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
    paths:
      - "public/**"
      - "KasiLink/**"
      - "kopano-labs-web/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (all | kopanolabs | kasilink | careers)"
        required: false
        default: "all"

permissions:
  contents: read

env:
  # ── IONOS FTP credentials — stored in GitHub Secrets ──────────────
  IONOS_HOST:     ${{ secrets.IONOS_FTP_HOST }}
  IONOS_USER:     ${{ secrets.IONOS_FTP_USER }}
  IONOS_PASS:     ${{ secrets.IONOS_FTP_PASS }}

  # ── Remote paths on IONOS web space ──────────────────────────────
  # Adjust these to match your IONOS directory layout
  REMOTE_KOPANOLABS: "/"            # apex public_html root
  REMOTE_CAREERS:    "/careers"     # careers subdirectory (or separate domain root)
  REMOTE_KASILINK:   "/"            # kasilink.com public_html root (set IONOS_KASILINK_* secrets separately)

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1 — KPGS Gate: run lint + governance check before any deploy
  # ──────────────────────────────────────────────────────────────────
  kpgs-gate:
    name: "KPGS Gate (ALP + IKP)"
    runs-on: ubuntu-latest
    outputs:
      alp_hash: ${{ steps.alp.outputs.hash }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install KPGS runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ./kopano-core

      - name: ALP Activation receipt
        id: alp
        run: |
          python poc-vs-foc/alp_protocol/alp_auto_lpm_protocol.py | tee /tmp/alp_out.txt
          HASH=$(python -c "import json,sys; lines=[l for l in open('/tmp/alp_out.txt') if 'consistency_hash' in l]; print(lines[-1].split('\"')[-2] if lines else 'unknown')" 2>/dev/null || echo "ci_run")
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "ALP hash: $HASH"

      - name: NCCNP + IKP governance tick
        run: |
          cd kopano-core
          python -m kopano.gsmb_auto_runner --once 2>&1 | grep -E "TICK|verdict|POC_CLOSED|CLEAN|hash"

      - name: Validate HTML files exist
        run: |
          test -f public/index.html      && echo "✅ public/index.html"
          test -f public/careers/index.html && echo "✅ public/careers/index.html"
          test -f KasiLink/index.html    && echo "✅ KasiLink/index.html"

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy KopanoLabs.com (public/) to IONOS
  # ──────────────────────────────────────────────────────────────────
  deploy-kopanolabs:
    name: "Deploy → kopanolabs.com"
    runs-on: ubuntu-latest
    needs: kpgs-gate
    if: |
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'kopanolabs' ||
      github.event.inputs.target == ''
    environment:
      name: kopanolabs-production
      url: https://kopanolabs.com

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload public/ → IONOS (KopanoLabs.com root)
        env:
          FTP_HOST: ${{ secrets.IONOS_FTP_HOST }}
          FTP_USER: ${{ secrets.IONOS_FTP_USER }}
          FTP_PASS: ${{ secrets.IONOS_FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror --reverse --delete --verbose \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='.env' \
              public/ /
          "

      - name: Verify deployment
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kopanolabs.com || echo "000")
          echo "KopanoLabs.com HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then echo "✅ kopanolabs.com LIVE"; else echo "⚠️ Status $STATUS — DNS may still be propagating"; fi

  # ──────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy KasiLink.com (KasiLink/) to IONOS
  # Uses separate IONOS_KASILINK_* secrets (different hosting space)
  # ──────────────────────────────────────────────────────────────────
  deploy-kasilink:
    name: "Deploy → kasilink.com"
    runs-on: ubuntu-latest
    needs: kpgs-gate
    if: |
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'kasilink' ||
      github.event.inputs.target == ''
    environment:
      name: kasilink-production
      url: https://kasilink.com

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload KasiLink/ → IONOS (kasilink.com root)
        env:
          FTP_HOST: ${{ secrets.IONOS_KASILINK_FTP_HOST }}
          FTP_USER: ${{ secrets.IONOS_KASILINK_FTP_USER }}
          FTP_PASS: ${{ secrets.IONOS_KASILINK_FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror --reverse --delete --verbose \
              --exclude='.git/' \
              KasiLink/ /
          "

      - name: Verify deployment
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kasilink.com || echo "000")
          echo "KasiLink.com HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then echo "✅ kasilink.com LIVE"; else echo "⚠️ Status $STATUS"; fi

  # ──────────────────────────────────────────────────────────────────
  # JOB 4 — Post-deploy KPGS governance receipt
  # ──────────────────────────────────────────────────────────────────
  kpgs-receipt:
    name: "KPGS Post-Deploy Receipt"
    runs-on: ubuntu-latest
    needs: [deploy-kopanolabs, deploy-kasilink]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: pip install -e . -e ./kopano-core

      - name: Final ALP receipt + APU check
        run: |
          python poc-vs-foc/alp_protocol/alp_auto_lpm_protocol.py
          echo "──────────────────────────────────────────"
          echo "KPGS Deploy Receipt"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Run ID:   ${{ github.run_id }}"
          echo "ALP hash: ${{ needs.kpgs-gate.outputs.alp_hash }}"
          echo "NCCNP:    4/4 POC_CLOSED (pre-deploy gate)"
          echo "I_AM_STATELESS_RENTER_NOT_LANDLORD"
          echo "──────────────────────────────────────────"
