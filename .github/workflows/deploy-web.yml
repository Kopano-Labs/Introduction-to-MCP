name: "KPGS Web Deploy — Governed IONOS Surfaces"

# ──────────────────────────────────────────────────────────────────────
# KPGS Governance: Schematics MAIN BRAIN · ALP #168 · ce3519483f5eff54
# Deploys from THIS repository:
#   kopanolabs.com         → public/
#   careers.kopanolabs.com → public/careers/
#
# KasiLink is NOT deployed from this repository.
# Runtime truth (2026-08-18): canonical source = Kopano-Labs/KasiLink,
# canonical current Vercel project = kasi-link.
# See: Schematics/02-Strategy/KasiLink Runtime Source DNS Truth Lock 2026-08-18.md
#
# CrisisConnect deploys via its own repo to Vercel (separate pipeline).
# I_AM_STATELESS_RENTER_NOT_LANDLORD
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, codex/kc-sovereign-gui-full-dev, jiro/stap-session4]
    paths:
      - "public/**"
      - "kopano-labs-web/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (all | kopanolabs | careers)"
        required: false
        default: "all"

permissions:
  contents: read

env:
  # IONOS credentials apply only to the surfaces owned by this workflow.
  IONOS_HOST: ${{ secrets.IONOS_FTP_HOST }}
  IONOS_USER: ${{ secrets.IONOS_FTP_USER }}
  IONOS_PASS: ${{ secrets.IONOS_FTP_PASS }}

  REMOTE_KOPANOLABS: "/"
  REMOTE_CAREERS: "/careers"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1 — KPGS Gate: run governance checks before any deploy
  # ──────────────────────────────────────────────────────────────────
  kpgs-gate:
    name: "KPGS Gate (ALP + IKP)"
    runs-on: ubuntu-latest
    outputs:
      alp_hash: ${{ steps.alp.outputs.hash }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install KPGS runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ./kopano-core

      - name: ALP Activation receipt
        id: alp
        run: |
          python poc-vs-foc/alp_protocol/alp_auto_lpm_protocol.py | tee /tmp/alp_out.txt
          HASH=$(python -c "import json,sys; lines=[l for l in open('/tmp/alp_out.txt') if 'consistency_hash' in l]; print(lines[-1].split('\"')[-2] if lines else 'unknown')" 2>/dev/null || echo "ci_run")
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "ALP hash: $HASH"

      - name: NCCNP + IKP governance tick
        run: |
          cd kopano-core
          python -m kopano.gsmb_auto_runner --once 2>&1 | grep -E "TICK|verdict|POC_CLOSED|CLEAN|hash"

      - name: Validate governed HTML surfaces exist
        run: |
          test -f public/index.html && echo "✅ public/index.html"
          test -f public/careers/index.html && echo "✅ public/careers/index.html"

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy KopanoLabs.com / careers to IONOS
  # ──────────────────────────────────────────────────────────────────
  deploy-kopanolabs:
    name: "Deploy → kopanolabs.com"
    runs-on: ubuntu-latest
    needs: kpgs-gate
    if: |
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'kopanolabs' ||
      github.event.inputs.target == 'careers' ||
      github.event.inputs.target == ''
    environment:
      name: kopanolabs-production
      url: https://kopanolabs.com

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload public/ → IONOS (KopanoLabs.com root)
        env:
          FTP_HOST: ${{ secrets.IONOS_FTP_HOST }}
          FTP_USER: ${{ secrets.IONOS_FTP_USER }}
          FTP_PASS: ${{ secrets.IONOS_FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror --reverse --delete --verbose \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='.env' \
              public/ /
          "

      - name: Verify deployment
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kopanolabs.com || echo "000")
          echo "KopanoLabs.com HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then echo "✅ kopanolabs.com LIVE"; else echo "⚠️ Status $STATUS — DNS may still be propagating"; fi

  # ──────────────────────────────────────────────────────────────────
  # JOB 3 — Post-deploy KPGS governance receipt
  # ──────────────────────────────────────────────────────────────────
  kpgs-receipt:
    name: "KPGS Post-Deploy Receipt"
    runs-on: ubuntu-latest
    needs: [kpgs-gate, deploy-kopanolabs]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: pip install -e . -e ./kopano-core

      - name: Final ALP receipt + APU check
        run: |
          python poc-vs-foc/alp_protocol/alp_auto_lpm_protocol.py
          echo "──────────────────────────────────────────"
          echo "KPGS Deploy Receipt"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Run ID:   ${{ github.run_id }}"
          echo "ALP hash: ${{ needs.kpgs-gate.outputs.alp_hash }}"
          echo "NCCNP:    4/4 POC_CLOSED (pre-deploy gate)"
          echo "KasiLink: external canonical runtime — Kopano-Labs/KasiLink -> Vercel"
          echo "I_AM_STATELESS_RENTER_NOT_LANDLORD"
          echo "──────────────────────────────────────────"
