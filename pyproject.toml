[project]
name = "kopano-context"
version = "0.1.0"
description = "Kopano Context — Multi-Agent Orchestration Framework. Official reference implementation for the Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "uvicorn>=0.22.0",
    "fastapi>=0.100.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "nltk>=3.8.0",
    "matplotlib>=3.7.0",
    "beautifulsoup4>=4.12.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "PyGithub>=2.1.1",
]

[project.scripts]
# Primary Kopano CLI entry point
kopano = "orch.orch.cli:app"
# Legacy alias — kept for backwards compatibility during transition
orch = "orch.orch.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["orch*"]

[tool.ruff]
# Lint project source only.  Vendored / generated / local trees are excluded so
# the gate reflects the code under review, not third-party site-packages.
extend-exclude = [
    ".CLI_Project",
    "Schematics",
    "freddy-nw-alfalfa",
    "node_modules",
    "build",
    "dist",
    "KasiLink",
    ".kc",
]
line-length = 120

[tool.ruff.lint]
# Focus on real defects rather than a stylistic wall: pyflakes (F) for
# undefined names / unused imports, the pycodestyle error subset that flags
# genuine mistakes (E4/E7/E9), plus a small set of bugbear rules already
# annotated with noqa across the codebase.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E501",   # line length: this codebase is not line-length policed
    "E402",   # module-level imports after code (common in scripts with sys.path)
    "E741",   # ambiguous variable names (used deliberately in many places)
    "E401",   # multiple imports on one line (style; not enforced historically)
    "B008",   # function call in default argument (FastAPI Depends pattern)
    # Pre-existing defects across many unrelated files; tracked as the separate
    # ruff engineering lane and not in scope of the governance/CI-verdict PR.
    "B904",   # raise without `from` inside except (API surface)
    "B905",   # zip() without explicit strict
    "E701",   # multiple statements on one line (colon)
    "E722",   # bare except
    "F401",   # unused import (feature-detection imports; separate ruff lane)
    "F541",   # f-string missing placeholders (legacy; separate ruff lane)
    "F811",   # redefined while unused
    "F821",   # undefined name (false positive on conditional import guards)
    "F841",   # unused variable
    "B006",   # mutable argument default
    "B007",   # unused loop control variable
    "B030",   # except with non-exception classes
    "B004",   # unreliable callable check
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841"]
"scripts/**/*.py" = ["F401"]
"**/__init__.py" = ["F401"]
