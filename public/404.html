<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D1117">
  <title>404 — Page Not Found | Kopano Labs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D1117;
      color: #E2E8F0;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #F5A623;
      border-radius: 50%;
      opacity: 0.4;
      animation: float 8s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
      50% { transform: translateY(-60px) translateX(20px); opacity: 0.6; }
    }
    .container {
      text-align: center;
      z-index: 1;
      padding: 2rem;
    }
    .code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      background: linear-gradient(135deg, #F5A623, #00E676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 600;
      color: #E2E8F0;
      margin-bottom: 0.5rem;
    }
    p {
      color: #8B949E;
      font-size: 1rem;
      margin-bottom: 2rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .home-link {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #F5A623, #e6951a);
      color: #0D1117;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .home-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 166, 35, 0.3);
    }
    .kpgs-badge {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #484f58;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The signal you're looking for doesn't exist at this coordinate. It may have been moved, severed, or never existed.</p>
    <a href="https://kopanolabs.com" class="home-link">← Back to Kopano Labs</a>
    <div class="kpgs-badge">KPGS GOVERNED · KHELOS FIREWALL · I_AM_STATELESS_RENTER_NOT_LANDLORD</div>
  </div>
  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 8 + 's';
      p.style.animationDuration = (6 + Math.random() * 4) + 's';
      container.appendChild(p);
    }
  </script>
</body>
</html>
