[package]
name = "kpgs-automerge-iroh-sync-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
automerge = "=0.10.0"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
